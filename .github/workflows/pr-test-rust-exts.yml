name: PR Test (Rust extensions)

# In-crate checks for the Rust crates bundled with the `sglang` wheel
# (rust/sglang-mm, rust/sglang-radix, rust/sglang-scheduler,
# rust/sglang-server). The pyo3 bindings themselves are exercised by the
# Python unit suite (base-a-test-cpu), which builds the extensions from
# source; these jobs cover the pure-Rust core, exactly as it is linked, plus
# lints.
#
# Scoped to the crates that have an in-crate test suite on purpose:
# sglang-grpc has none yet, so a `rust/**` trigger would spawn a job that
# does not actually cover the changed crate. Widen the paths together with
# the job.

on:
  push:
    branches: [ main ]
    paths:
      - "rust/sglang-mm/**"
      - "rust/sglang-radix/**"
      - "rust/sglang-scheduler/**"
      - "rust/sglang-server/**"
      - "rust/Cargo.toml"
      - ".github/workflows/pr-test-rust-exts.yml"
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "rust/sglang-mm/**"
      - "rust/sglang-radix/**"
      - "rust/sglang-scheduler/**"
      - "rust/sglang-server/**"
      - "rust/Cargo.toml"
      - ".github/workflows/pr-test-rust-exts.yml"
  workflow_dispatch:

concurrency:
  group: rust-exts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sglang-mm-unit:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-ci')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust/sglang-mm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace root owns Cargo.lock and target/.
          workspaces: rust

      # rustfmt and non-test clippy for rust/ are already gated by the Lint
      # workflow's pre-commit hooks; `--all-targets` is the part it misses, so
      # this lints the test code too rather than duplicating that gate.
      - name: cargo clippy (test targets)
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

      # Default features are exactly what sglang-server links: no pyo3, no
      # rayon. `rlib_is_single_threaded` only runs in this shape.
      - name: cargo test (rlib shape — no pyo3, no rayon)
        run: cargo test

      # The wheel's shape (minus pyo3, whose extension-module crates cannot
      # link test binaries). Both shapes must pass: `common::par` has two
      # implementations and results are required to be identical.
      - name: cargo test (parallel shape)
        run: cargo test --features parallel

  sglang-radix-unit:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-ci')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust/sglang-radix
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace root owns Cargo.lock and target/.
          workspaces: rust

      - name: cargo clippy (all targets)
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

      # Pure-Rust radix core: golden + property tests.
      - name: cargo test
        run: cargo test

      - name: cargo bench (compile-check the criterion benches)
        run: cargo bench --no-run

  sglang-scheduler-unit:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-ci')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/sglang-scheduler
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace root owns Cargo.lock and target/.
          workspaces: rust

      - name: cargo clippy (all targets)
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

      # The rlib shape (planner / adder / ntr / policy / core), exactly what
      # the cdylib links: no pyo3.
      - name: cargo test (rlib shape — no pyo3)
        run: cargo test

      - name: cargo bench (compile-check the criterion benches)
        run: cargo bench --no-run

      # The wheel's shape: build the PyO3 extension and drive it through the
      # in-repo smoke test (loads the .so, no model / GPU needed).
      - name: cargo build (pyo3 cdylib shape)
        run: cargo build --features python

      - name: Run pyo3 smoke test
        run: python3 smoke_test.py

  sglang-server-unit:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-ci')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/sglang-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace root owns Cargo.lock and target/.
          workspaces: rust

      - name: cargo clippy (all targets)
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

      # Stream frame builder + string-stop decision logic (plan.md M5):
      # pure-Rust unit tests; the pyo3 surface is exercised by the Python
      # parity suite (base-a-test-cpu), which builds the cdylib from source.
      - name: cargo test
        run: cargo test

      - name: cargo bench (compile-check the M9 stream-frame benches)
        run: cargo bench --no-run
